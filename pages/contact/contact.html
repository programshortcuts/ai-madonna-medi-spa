<div  tabindex="0" data-nav-target="main-container-contact" class="page-container contact-page-container">
    
    

    <div class="contact-container">
        
        <div class="contact-item form-contact-container">
            <form tabindex="0" id="contactForm" method="POST" novalidate>
                <div class="form-group">
                    <label data-nav-target="first-name-in"tabindex="0" for="first-name">First Name</label>
                    <input  id="first-name" name="firstName" type="text" required>
                </div>

                <div class="form-group">
                    <label data-nav-target="last-name-in" tabindex="0" for="last-name">Last Name</label>
                    <input  id="last-name" name="lastName" type="text" required>
                </div>

                <div class="form-group">
                    <label data-nav-target="email-in" tabindex="0" for="email">Email</label>
                    <input id="email" name="email" type="email" required>
                </div>

                <div class="form-group">
                    <label data-nav-target="phone-in" tabindex="0" for="phone">Phone</label>
                    <input id="phone" name="phone" type="tel">
                </div>

                <div class="form-group">
                    <label data-nav-target="message-in" tabindex="0" for="message">Message</label>
                    <textarea   id="message" name="message" rows="4" required></textarea>
                </div>

                <button tabindex="0" data-nav-target="submit-btn" id="submitBtn" type="submit">Submit</button>

            </form>
        </div>
        
        <div class="social-media-email-container">
